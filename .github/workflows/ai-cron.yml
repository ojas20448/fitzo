name: AI Coach Cron

# Triggers the backend's scheduled AI jobs:
# - Daily insights: every day at 01:00 UTC (06:30 IST) — morning coach note + push
# - Weekly recaps: Mondays at 01:30 UTC (07:00 IST) — last week's summary
# - Quiet-hours nudge: every day at 12:30 UTC (18:00 IST) — pre-evening rush
#
# Requires repo secret CRON_SECRET matching the API's CRON_SECRET env var.
# FITZO_API_ORIGIN selects the verified replacement after migration.

on:
  schedule:
    - cron: "0 1 * * *"    # daily insights — 06:30 IST
    - cron: "30 1 * * 1"   # weekly recaps — Mondays 07:00 IST
    - cron: "30 12 * * *"   # quiet-hours nudge — 18:00 IST, pre-evening rush
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options:
          - daily-insights
          - weekly-recaps
          - quiet-alerts
        required: false
        default: "daily-insights"

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_ORIGIN: ${{ vars.FITZO_API_ORIGIN || 'https://fitzo.onrender.com' }}
    steps:
      - name: Validate API origin
        run: |
          [[ "$API_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || {
            echo "FITZO_API_ORIGIN must be an HTTPS origin without a path or credentials"
            exit 1
          }
      - name: Determine job
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_JOB: ${{ github.event.inputs.job }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ENDPOINT="$REQUESTED_JOB"
          elif [ "$SCHEDULE" = "30 1 * * 1" ]; then
            ENDPOINT=weekly-recaps
          elif [ "$SCHEDULE" = "30 12 * * *" ]; then
            ENDPOINT=quiet-alerts
          else
            ENDPOINT=daily-insights
          fi
          case "$ENDPOINT" in
            daily-insights|weekly-recaps|quiet-alerts) ;;
            *) echo "Unsupported cron job"; exit 1 ;;
          esac
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Check server reachability
        if: steps.pick.outputs.endpoint == 'quiet-alerts'
        run: curl --fail --silent --show-error -m 90 "$API_ORIGIN/api/health"

      - name: Skip AI batches until account consent is server-verifiable
        if: steps.pick.outputs.endpoint != 'quiet-alerts'
        run: echo "Daily and weekly AI processing is paused. Opted-in users can request reports in the app."

      - name: Trigger ${{ steps.pick.outputs.endpoint }}
        if: steps.pick.outputs.endpoint == 'quiet-alerts'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: ${{ steps.pick.outputs.endpoint }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing from repository secrets"
            exit 1
          fi
          CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -m 60 \
            -X POST "$API_ORIGIN/api/cron/$ENDPOINT" \
            -H "x-cron-secret: $CRON_SECRET")
          cat /tmp/resp.txt
          if [ "$CODE" != "202" ]; then
            echo "❌ Cron trigger failed with HTTP $CODE"
            exit 1
          fi
          echo "✅ $ENDPOINT batch started"
