# Import this blueprint from the repository root after a separate database is ready.
services:
  - type: web
    name: fitzo-worker-staging
    runtime: node
    region: singapore
    plan: free
    branch: codex/antigravity-worker
    autoDeployTrigger: off
    buildCommand: npm ci --prefix backend
    startCommand: node backend/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: laptop-worker
      - key: AI_QUEUE_LIMIT
        value: "30"
      - key: AI_WORKER_WAIT_MS
        value: "45000"
      - key: AI_WORKER_API_FALLBACK
        value: "true"
