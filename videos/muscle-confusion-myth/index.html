<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle Confusion Myth - Reel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/EasePack.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000000;
        }
    </style>
</head>
<body>
    <div data-hf-id="root-container" id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920" style="position: relative; overflow: hidden;">
        <div id="scene-01" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="4.0" class="clip" style="position: absolute; inset: 0;"></div>
        <div id="scene-02" data-composition-id="02-myth" data-composition-src="compositions/frames/02-myth.html" data-start="4.0" data-duration="4.0" class="clip" style="position: absolute; inset: 0;"></div>
        <div id="scene-03" data-composition-id="03-reality" data-composition-src="compositions/frames/03-reality.html" data-start="8.0" data-duration="4.0" class="clip" style="position: absolute; inset: 0;"></div>
        <div id="scene-04" data-composition-id="04-solution" data-composition-src="compositions/frames/04-solution.html" data-start="12.0" data-duration="4.0" class="clip" style="position: absolute; inset: 0;"></div>
        <div id="scene-05" data-composition-id="05-advice" data-composition-src="compositions/frames/05-advice.html" data-start="16.0" data-duration="6.0" class="clip" style="position: absolute; inset: 0;"></div>
        <div id="scene-06" data-composition-id="06-cta" data-composition-src="compositions/frames/06-cta.html" data-start="22.0" data-duration="8.0" class="clip" style="position: absolute; inset: 0;"></div>
    </div>
    <script>
        gsap.registerPlugin(TextPlugin);
        window.__timelines = window.__timelines || {};
        
        const mainTl = gsap.timeline({ paused: true });
        window.__timelines["main"] = mainTl;
        
        document.querySelectorAll('[data-composition-id]').forEach(el => {
            const id = el.getAttribute('data-composition-id');
            if (id === 'main') return;
            
            const start = parseFloat(el.getAttribute('data-start'));
            if (window.__timelines[id]) {
                mainTl.add(window.__timelines[id], start);
            }
        });
    </script>
</body>
</html>
