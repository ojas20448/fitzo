<template id="02-myth">
    <style>
        @font-face { font-family: 'Lexend'; src: url('assets/fonts/Lexend-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: block; }
        
        #root { width: 1080px; height: 1920px; background: #FF2A2A; position: relative; overflow: hidden; font-family: 'Lexend', sans-serif; color: #FFFFFF; }
        
        .grain { position: absolute; inset: 0; z-index: 999; pointer-events: none; opacity: 0.15; background-image: repeating-radial-gradient(circle at 50% 50%, #000 0, #000 2px, transparent 2px, transparent 100%); background-size: 4px 4px; }
        
        .container { position: absolute; top: 50%; left: 50%; width: 900px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 20px; }
        
        .text-line { font-size: 130px; font-weight: 900; text-transform: uppercase; line-height: 0.9; letter-spacing: -3px; opacity: 0; }
        .myth-word { font-size: 200px; font-weight: 900; color: #000000; text-shadow: 15px 15px 0px #FFFFFF; opacity: 0; }
        
        /* Glitch layers */
        .glitch-wrapper { position: relative; display: inline-block; }
        .glitch-layer { position: absolute; top: 0; left: 0; color: #000000; opacity: 0; }
        .glitch-cyan { text-shadow: -10px 0 #00FFFF; }
        .glitch-magenta { text-shadow: 10px 0 #FF00FF; }
    </style>
    <div id="root" data-composition-id="02-myth" data-duration="4.0" data-width="1080" data-height="1920">
        <div class="grain"></div>
        <div class="container" id="myth-container">
            <div class="text-line" id="line1">MUSCLE</div>
            <div class="text-line" id="line2">CONFUSION</div>
            <div class="text-line" id="line3">IS A</div>
            <div class="glitch-wrapper" data-layout-allow-overlap="true">
                <div class="myth-word" id="myth-main">MYTH</div>
                <div class="myth-word glitch-layer glitch-cyan" id="myth-c">MYTH</div>
                <div class="myth-word glitch-layer glitch-magenta" id="myth-m">MYTH</div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            const tl = gsap.timeline();
            
            // Set initial transforms because of translate(-50%, -50%)
            gsap.set('#myth-container', { xPercent: -50, yPercent: -50 });
            
            tl.fromTo('#line1', {y: 100, opacity: 0}, {y: 0, opacity: 1, duration: 0.2, ease: 'power4.out'}, 0.2);
            tl.fromTo('#line2', {y: 100, opacity: 0}, {y: 0, opacity: 1, duration: 0.2, ease: 'power4.out'}, 0.4);
            tl.fromTo('#line3', {y: 100, opacity: 0}, {y: 0, opacity: 1, duration: 0.2, ease: 'power4.out'}, 0.6);
            
            tl.fromTo('#myth-main', {scale: 3, opacity: 0}, {scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)'}, 1.0);
            
            // Glitch effect
            tl.to('#myth-c', {opacity: 1, x: -15, duration: 0.05, yoyo: true, repeat: 5}, 1.1);
            tl.to('#myth-m', {opacity: 1, x: 15, duration: 0.05, yoyo: true, repeat: 5}, 1.15);
            
            tl.to(['#myth-c', '#myth-m'], {opacity: 0, duration: 0.05}, 1.45);
            
            window.__timelines['02-myth'] = tl;
        })();
    </script>
</template>
