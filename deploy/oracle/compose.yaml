name: fitzo

services:
  api:
    image: fitzo-api:${APP_GIT_COMMIT:?Set APP_GIT_COMMIT to the tested full Git revision}
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
      args:
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:?Set APP_GIT_COMMIT}
    restart: unless-stopped
    init: true
    env_file:
      - path: ./production.env
        required: true
        format: raw
    environment:
      NODE_ENV: production
      PORT: "3001"
      APP_GIT_COMMIT: ${APP_GIT_COMMIT:?Set APP_GIT_COMMIT}
      DB_SSL_MODE: verify-full
      RENDER_EXTERNAL_URL: ""
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health', {signal: AbortSignal.timeout(12000)}).then(async r => {const h = await r.json(); process.exit(r.ok && h.status === 'ok' && h.services?.database === 'ok' && h.commit === process.env.APP_GIT_COMMIT ? 0 : 1)}).catch(() => process.exit(1))"
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    profiles:
      - https
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.fitzoapp.in}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
